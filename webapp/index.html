<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prisma organiza suas apostas na Lotofácil, Mega-Sena, Quina, Lotomania, Dupla Sena e Dia de Sorte com um otimizador combinatório: mais cobertura, menos sobreposição entre bilhetes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,600;0,700;1,600;1,700&display=swap"
    />
    <title>Prisma — apostas com método, não palpite</title>
    <script>
      // Aplica o tema antes da primeira pintura (evita flash). Claro e o padrao.
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var dark = s === "dark" || (s == null && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
